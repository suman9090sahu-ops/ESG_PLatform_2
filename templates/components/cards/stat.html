<!-- Stat Card Component -->
<div class="card card-esg h-100">
  <div class="card-body p-3 p-md-4">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <span class="text-muted small text-uppercase font-weight-bold letter-spacing-1">{{ title }}</span>
      {% if icon %}
        <div class="esg-icon-box {{ icon_bg_class|default:'env' }}">
          <i class="{{ icon }}" aria-hidden="true"></i>
        </div>
      {% endif %}
    </div>
    <div class="d-flex align-items-baseline gap-2 mb-2">
      <h3 class="font-weight-bold text-dark mb-0">{{ value }}</h3>
      {% if unit %}
        <span class="text-muted small font-weight-medium">{{ unit }}</span>
      {% endif %}
    </div>
    {% if delta %}
      <div class="small">
        {{ delta|safe }}
        {% if delta_label %}
          <span class="text-muted ms-1">{{ delta_label }}</span>
        {% endif %}
      </div>
    {% endif %}
  </div>
</div>
