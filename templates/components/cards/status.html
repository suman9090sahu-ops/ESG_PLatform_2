<!-- Status Card Component -->
<div class="card card-esg border-start border-4 border-{{ border_variant|default:'primary' }} h-100">
  <div class="card-body p-3">
    <div class="d-flex justify-content-between align-items-center mb-1">
      <span class="text-muted small text-uppercase font-weight-bold">{{ label }}</span>
      <span class="badge bg-{{ badge_variant|default:'light' }} text-dark border">{{ status_text }}</span>
    </div>
    <div class="h4 font-weight-bold mb-1 text-dark">{{ metric_value }}</div>
    <p class="text-muted small mb-0">{{ description }}</p>
  </div>
</div>
