<!-- ESG Calculation Presentation Indicator -->
<div class="d-inline-flex flex-column align-items-start {{ extra_class }}">
  {% if show_label|default:True %}
    <span class="text-muted small fw-medium mb-1">GHG Computation</span>
  {% endif %}
  <span class="esg-indicator indicator-calculated" title="GHG Emissions Formula Engine: Calculated">
    <span class="me-1">{{ label|default:"Calculated" }}</span>
    <i class="icon-check" aria-hidden="true"></i>
    <span class="sr-only">[✓]</span>
  </span>
</div>
