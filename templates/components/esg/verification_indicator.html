<!-- ESG Verification Presentation Indicator -->
<div class="d-inline-flex flex-column align-items-start {{ extra_class }}">
  {% if show_label|default:True %}
    <span class="text-muted small fw-medium mb-1">Verification</span>
  {% endif %}
  <span class="esg-indicator indicator-verified" title="Audit Status: Verified">
    <span class="me-1">Verified</span>
    <i class="icon-check" aria-hidden="true"></i>
    <span class="sr-only">[✓]</span>
  </span>
</div>
