<!-- Date Input Component -->
<div class="mb-3 {{ wrapper_class }}">
  {% if label %}
    <label for="{{ id|default:name }}" class="form-label form-label-esg">
      <span>{{ label }}</span>
      {% if required %}
        <span class="required-star" aria-hidden="true">*</span>
        <span class="sr-only">(required)</span>
      {% endif %}
    </label>
  {% endif %}

  <div class="input-group">
    <span class="input-group-text bg-white border-end-0 text-muted">
      <i class="icon-calendar" aria-hidden="true"></i>
    </span>
    <input type="date"
           class="form-control form-control-esg border-start-0 ps-0 {% if errors %}is-invalid{% endif %} {{ extra_class }}"
           id="{{ id|default:name }}"
           name="{{ name }}"
           value="{{ value|default:'' }}"
           {% if required %}required aria-required="true"{% endif %}
           {% if disabled %}disabled{% endif %}>
  </div>

  {% if help_text %}
    <div class="form-help-text">{{ help_text }}</div>
  {% endif %}

  {% if errors %}
    <div class="form-error-feedback" role="alert">
      <i class="icon-close" aria-hidden="true"></i>
      <span>{{ errors.0|default:errors }}</span>
    </div>
  {% endif %}
</div>
