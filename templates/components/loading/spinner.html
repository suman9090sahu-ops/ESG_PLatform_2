<!-- Loading Spinner & Skeleton Placeholder Component -->
<div class="esg-loading-container {{ extra_class }}" role="status" aria-live="polite">
  {% if skeleton %}
    <div class="placeholder-glow">
      <div class="placeholder col-12 mb-2 rounded py-2"></div>
      <div class="placeholder col-8 mb-2 rounded py-2"></div>
      <div class="placeholder col-6 rounded py-2"></div>
    </div>
  {% else %}
    <div class="spinner-border text-{{ color|default:'success' }} esg-spinner-glow mb-2" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="text-muted small mb-0 font-weight-medium">
      {{ message|default:"Processing ESG telemetry data..." }}
    </p>
  {% endif %}
</div>
