{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  {% include "base/_head.html" %}
</head>
<body class="bg-white">
  <div class="blank-layout-wrapper p-3 p-md-4">
    {% if messages %}
      <div class="mb-3">
        {% for message in messages %}
          <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags %}{{ message.tags }}{% else %}info{% endif %} alert-dismissible fade show small" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
  </div>

  {% include "base/_scripts.html" %}
</body>
</html>
